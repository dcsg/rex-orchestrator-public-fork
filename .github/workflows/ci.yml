name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install shellcheck
      - name: shellcheck (every shell script, following sourced files)
        run: tests/shellcheck.sh
      - name: Python compiles
        run: python3 -m py_compile tests/harness/*.py

  test:
    runs-on: macos-latest
    env:
      REX_TEST_REQUIRE_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bash jq luajit
      - name: Installer tests
        run: tests/install_test.sh
      - name: Cage profile (zero tokens)
        run: tests/cage/zt.sh
      - name: Lua unit and standalone tests
        run: |
          luajit tests/lua/unit.lua .
          bash -p tests/lua/standalone.sh
      - name: Shell entry and wrappers (Bash 3.2 and 5)
        run: tests/harness/run.sh
        timeout-minutes: 10
